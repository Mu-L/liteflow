# 启动时自动导入 /var/lib/grafana/dashboards 下的所有仪表盘 JSON
apiVersion: 1

providers:
  - name: liteflow
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
