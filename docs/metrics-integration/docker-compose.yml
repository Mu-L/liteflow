# LiteFlow 指标可视化最小栈：Prometheus（抓取 + 存储） + Grafana（画图）
#
# 用法：
#   1. 先确保你的应用已暴露 /actuator/prometheus（见 ../liteflow-metrics-guide.md 上手篇）
#   2. 按需修改 prometheus.yml 里的抓取目标（默认 host.docker.internal:8080）
#   3. 在本目录执行：docker compose up -d
#   4. 打开 Grafana：http://localhost:3000 （已开匿名访问，免登录）
#      仪表盘「LiteFlow 概览」已自动挂好；Prometheus UI 在 http://localhost:9090
#
# 全部为演示配置，请勿直接用于生产。
name: liteflow-metrics

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: liteflow-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # 让容器内能用 host.docker.internal 访问到“宿主机上的应用”。
    # Docker Desktop（Mac/Windows）本就支持；这一行让 Linux 也能用。
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: liteflow-grafana
    ports:
      - "3000:3000"
    environment:
      # 演示用：开匿名访问并给 Admin 角色，打开即用、免登录
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      # 自动挂好 Prometheus 数据源 + 自动导入 LiteFlow 仪表盘
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
