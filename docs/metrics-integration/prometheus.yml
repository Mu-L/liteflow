# Prometheus 抓取配置（演示用）
global:
  scrape_interval: 5s        # 演示抓得勤一点；生产一般 15s~30s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "liteflow-app"
    metrics_path: "/actuator/prometheus"     # Actuator 暴露的 Prometheus 出口
    static_configs:
      # ↓↓↓ 改成你应用的 host:port ↓↓↓
      #  - Mac / Windows（Docker Desktop）：host.docker.internal 指向宿主机，保持即可
      #  - Linux：配合 docker-compose.yml 里的 extra_hosts: host-gateway 也可用
      #  - 端口换成你的 server.port（默认 8080；liteflow-example 是 8581）
      - targets: ["host.docker.internal:8080"]
