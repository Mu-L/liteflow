spring.application.name=ruledb-sql-boot4-it
spring.datasource.url=jdbc:h2:mem:ruledb-boot4;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

liteflow.rule-db.enabled=true
liteflow.rule-db.sql.auto-init-table=true
liteflow.rule-db.sql.change-log-batch-size=17
liteflow.rule-db.sync.poll-seconds=3600
liteflow.rule-db.sync.reconcile-seconds=3600
