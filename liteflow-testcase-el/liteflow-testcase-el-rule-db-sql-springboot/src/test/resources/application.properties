# H2 内存库：DataSourceAutoConfiguration 据此产生容器 DataSource（HikariCP），
# SqlConnectionManager 因 rule-db.url 为空，会自动复用该 DataSource bean。
spring.datasource.url=jdbc:h2:mem:ruledb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.application.name=ruledb-sql-it

# liteflow.rule-db.* 由 RuleDbTestConfig 在 @PostConstruct 编程式注入 RuleDbConfig
# （计划 3 的 starter 绑定尚未完成，properties 绑定不生效，故不在本文件配置）。
